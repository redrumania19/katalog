<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Ürün | Troy Soapun</title>
<link rel="icon" type="image/png" href="logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html#top" class="brand">
      <img src="logo-256.png" class="brand-logo" alt="Troy Soapun logosu">
      <span class="brand-name">Troy Soapun</span>
    </a>
    <nav class="main-nav">
      <a href="index.html#urunler">Ürünler</a>
      <a href="index.html#hakkimizda">Hakkımızda</a>
      <a href="index.html#iletisim">İletişim</a>
    </nav>
    <a href="index.html#iletisim" class="btn btn-outline nav-cta">İletişime Geç</a>
  </div>
</header>

<main>
  <section class="product-detail">
    <div class="container">
      <a id="back-link" href="index.html#urunler" class="back-link">← Kategoriye dön</a>

      <div class="detail-grid">
        <div class="detail-image-wrap">
          <img id="detail-image" src="" alt="">
          <div class="detail-nav">
            <a id="prev-link" class="detail-nav-btn" href="#" aria-label="Önceki">‹</a>
            <span id="detail-counter" class="detail-counter"></span>
            <a id="next-link" class="detail-nav-btn" href="#" aria-label="Sonraki">›</a>
          </div>
        </div>

        <div class="detail-info">
          <p class="eyebrow" id="detail-eyebrow">Ürün</p>
          <h1 id="detail-title">Ürün Adı</h1>
          <p id="detail-subtitle" class="detail-subtitle"></p>
          <p id="detail-desc" class="detail-desc"></p>
          <div class="detail-actions">
            <a id="order-link" class="btn btn-primary" href="#" target="_blank" rel="noopener">Sipariş için WhatsApp'tan Yaz</a>
            <label class="item-check item-check-lg">
              <input type="checkbox" class="quote-check" id="detail-quote-check">
              <span>Teklif listeme ekle</span>
            </label>
          </div>
        </div>
      </div>

      <div class="detail-variants">
        <h3>Bu kategorideki diğer çeşitler</h3>
        <div id="variant-strip" class="variant-strip"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>© 2026 Troy Soapun. Tüm hakları saklıdır.</p>
    <p class="footer-note">Bu site yalnızca ürün tanıtım kataloğu amaçlıdır.</p>
  </div>
</footer>

<script src="protect.js"></script>
<script src="products.js"></script>
<script src="quote.js"></script>
<script src="detail.js"></script>
</body>
</html>
